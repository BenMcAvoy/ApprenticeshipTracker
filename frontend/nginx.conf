server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # tRPC API. Scans stream over server-sent events and a single AI request can take minutes,
  # so buffering is off and timeouts are generous.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 50m;
  }

  # Single-page app: unknown paths fall back to index.html so file-based routes work on refresh.
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
